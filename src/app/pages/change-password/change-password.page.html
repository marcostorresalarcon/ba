<div class="flex min-h-screen items-center justify-center bg-alabaster px-4">
  <div class="w-full max-w-md rounded-[2.5rem] bg-white p-8 shadow-brand">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-pine/10">
        <svg class="h-8 w-8 text-pine" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="font-display text-2xl text-charcoal">Set Your Password</h1>
      <p class="mt-2 text-sm text-slate">
        Please create a new password before continuing.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <label class="flex flex-col gap-2 text-sm text-charcoal">
        New Password
        <input
          formControlName="newPassword"
          type="password"
          placeholder="At least 6 characters"
          class="rounded-2xl border px-4 py-3 focus:border-pine focus:outline-none"
          [class.border-red-500]="hasError('newPassword')"
          [class.border-fog]="!hasError('newPassword')"
        />
        @if (hasError('newPassword')) {
          <p class="text-xs text-red-600">Password must be at least 6 characters</p>
        }
      </label>

      <label class="flex flex-col gap-2 text-sm text-charcoal">
        Confirm Password
        <input
          formControlName="confirmPassword"
          type="password"
          placeholder="Repeat your password"
          class="rounded-2xl border px-4 py-3 focus:border-pine focus:outline-none"
          [class.border-red-500]="hasError('confirmPassword') || form.errors?.['mismatch']"
          [class.border-fog]="!hasError('confirmPassword') && !form.errors?.['mismatch']"
        />
        @if (form.errors?.['mismatch'] && form.controls.confirmPassword.touched) {
          <p class="text-xs text-red-600">Passwords do not match</p>
        }
      </label>

      <button
        type="submit"
        [disabled]="form.invalid || isSubmitting()"
        class="w-full rounded-2xl bg-pine py-3 text-sm font-semibold text-white transition hover:bg-pine/90 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (isSubmitting()) {
          Saving...
        } @else {
          Set Password & Continue
        }
      </button>
    </form>
  </div>
</div>
